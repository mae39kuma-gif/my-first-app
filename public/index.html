<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🐶 ゆうたはいまなにしている？</title>
  <!-- ブラウザのタブに表示される🐶アイコン -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐶</text></svg>" />
  <style>
    :root {
      --bg: #f6ede1;        /* クリーム色（わんこテーマ） */
      --card: #fffaf3;
      --accent: #b5793f;    /* 犬の毛色っぽい茶色 */
      --accent-dark: #8a5a2b;
      --text: #4a3625;
      --muted: #a98e72;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background: var(--bg);
      /* うっすら足あと🐾を背景に散らす */
      background-image: radial-gradient(circle at 10% 20%, rgba(181,121,63,0.05) 0 8px, transparent 9px),
                        radial-gradient(circle at 80% 60%, rgba(181,121,63,0.05) 0 8px, transparent 9px),
                        radial-gradient(circle at 40% 85%, rgba(181,121,63,0.05) 0 8px, transparent 9px);
      color: var(--text);
      -webkit-text-size-adjust: 100%;
    }
    .wrap { max-width: 480px; margin: 0 auto; padding: 20px 16px 60px; }
    h1 { font-size: 22px; margin: 8px 0 4px; }
    .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 18px;
      box-shadow: 0 2px 10px rgba(40,50,90,0.06);
    }
    label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 6px; }
    input[type="text"] {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #e2e5ee;
      border-radius: 10px;
      outline: none;
    }
    input[type="text"]:focus { border-color: var(--accent); }
    .buttons { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 4px; }
    button.status {
      padding: 16px 8px;
      font-size: 16px;
      border: none;
      border-radius: 12px;
      background: #f1e2cf;
      color: var(--text);
      cursor: pointer;
      transition: transform .05s, background .15s;
    }
    button.status:hover { background: #ead2b3; }
    button.status:active { transform: scale(0.97); }
    .send-row { display: flex; gap: 8px; margin-top: 12px; }
    .send-row input { flex: 1; }
    button.send {
      padding: 0 18px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      cursor: pointer;
    }
    .board { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 4px; }
    .person {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      border-radius: 12px;
      background: #f5e9d8;
      border: 1px solid #ecdcc4;
      animation: pop .25s ease;
    }
    .person.me { border-color: var(--accent); background: #f3e0c6; }
    @keyframes pop { from { transform: scale(0.96); opacity: .4; } to { transform: scale(1); opacity: 1; } }
    .emoji { font-size: 28px; }
    .person-name { font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 6px; }
    .you-tag { font-size: 10px; background: var(--accent); color: #fff; border-radius: 999px; padding: 1px 6px; }
    .person-status { font-size: 13px; }
    .person-time { color: var(--muted); font-size: 11px; margin-top: 2px; }
    .empty { color: var(--muted); font-size: 14px; text-align: center; padding: 16px; grid-column: 1 / -1; }
    .notice { font-size: 12px; color: var(--muted); margin-top: 8px; }
    .pill { display:inline-block; background:#f1e2cf; color:var(--accent-dark); border-radius:999px; padding:2px 10px; font-size:12px; }
    .meal-view { margin: 6px 0 4px; }
    .meal-row { display:flex; align-items:center; gap:10px; padding:8px 4px; border-bottom:1px dashed #ecdcc4; }
    .meal-row:last-child { border-bottom:none; }
    .meal-label { font-size:12px; color:#fff; background:var(--accent); border-radius:999px; padding:3px 10px; white-space:nowrap; }
    .meal-val { font-size:15px; font-weight:600; }
    .meal-val.empty-val { color:var(--muted); font-weight:400; }
    .master-card { background: linear-gradient(135deg, #fff6e9, #ffe9cf); border: 1px solid #f0d9b8; }
    .master-now { font-size: 18px; font-weight: 700; color: var(--accent-dark); margin-top: 4px; }
    .master-now.empty-val { color: var(--muted); font-weight: 400; font-size: 15px; }
    .master-time { font-size: 11px; color: var(--muted); margin-top: 4px; }
    .cheer-card { background: linear-gradient(135deg, #ffeef2, #ffe0ea); border: 1px solid #f3c6d4; }
    .cheer-now { font-size: 18px; font-weight: 700; color: #c2548a; margin-top: 4px; }
    .cheer-now.empty-val { color: var(--muted); font-weight: 400; font-size: 15px; }
    .mini-btn {
      background: var(--accent); color:#fff; border:none; border-radius:999px;
      padding:6px 14px; font-size:13px; cursor:pointer;
    }
    .mini-btn:active { transform: scale(0.96); }
    .finish-btn {
      margin-left:auto; background:#fff; color:var(--accent-dark);
      border:1px solid var(--accent); border-radius:999px;
      padding:6px 12px; font-size:13px; cursor:pointer; white-space:nowrap;
    }
    .finish-btn:active { transform: scale(0.96); }
    .person-status.done { color: var(--muted); text-decoration: line-through; }
    .toast {
      position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%) translateY(120px);
      background: var(--accent); color: #fff; padding: 16px 22px; border-radius: 16px;
      font-size: 16px; font-weight: 600; box-shadow: 0 6px 20px rgba(80,50,20,0.3);
      opacity: 0; transition: transform .3s ease, opacity .3s ease; z-index: 100;
      max-width: 88%; text-align: center; pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .care-buttons { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .care-btn {
      padding: 16px 8px; font-size: 16px; border: none; border-radius: 12px;
      background: #f1e2cf; color: var(--text); cursor: pointer;
      transition: transform .05s, background .15s;
    }
    .care-btn:active { transform: scale(0.97); }
    .care-btn.locked { background: #b5793f; color: #fff; }
    .care-state { font-size: 12px; color: var(--muted); margin-top: 8px; }
    .todo-warn {
      display: none; margin-top: 12px; padding: 10px 12px; border-radius: 10px;
      background: #ffe9e3; border: 1px solid #f3c0b2; color: #b5502f;
      font-size: 13px; font-weight: 600;
    }
    .todo-warn.show { display: block; }
    .stamp-box { margin-top: 14px; padding-top: 12px; border-top: 1px dashed #ecdcc4; }
    .stamp-title { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .stamp-title span { color: var(--accent-dark); font-weight: 700; }
    .stamp-row { font-size: 20px; line-height: 1.5; word-break: break-all; min-height: 26px; }
    .stamp-row .none { font-size: 13px; color: var(--muted); }
    .stamp-bar {
      position: relative; height: 10px; background: #efe2cd;
      border-radius: 999px; margin: 10px 0 8px; overflow: hidden;
    }
    .stamp-bar-fill {
      height: 100%; width: 0;
      background: linear-gradient(90deg, #e0a86b, var(--accent));
      border-radius: 999px; transition: width .4s ease;
    }
    .stamp-mark {
      position: absolute; top: 0; left: 50%;
      width: 2px; height: 100%; background: var(--card);
    }
    .stamp-goal {
      font-size: 14px; font-weight: 700; color: var(--accent-dark); margin-bottom: 10px;
    }
    .stamp-help {
      font-size: 12px; color: var(--muted); line-height: 1.8;
      background: #fdf6ec; border-radius: 10px; padding: 10px 12px;
    }
    .stamp-help b { color: var(--accent-dark); }
    .today-meal {
      display: flex; align-items: center; gap: 10px; margin: 6px 0 10px;
      padding: 12px; border-radius: 12px;
      background: linear-gradient(135deg, #fff3e0, #ffe6c7); border: 1px solid #f0d9b8;
    }
    .today-label {
      font-size: 12px; color: #fff; background: var(--accent-dark);
      border-radius: 999px; padding: 4px 10px; white-space: nowrap;
    }
    .today-val { font-size: 18px; font-weight: 700; color: var(--accent-dark); }
    .today-val.empty-val { font-size: 14px; font-weight: 400; color: var(--muted); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>🐶 ゆうたはいまなにしている？</h1>
    <p class="sub">🐾 ボタンを押すと、ご主人に通知が飛びます。</p>

    <div class="card master-card" id="masterCard">
      <label style="display:flex; align-items:center; justify-content:space-between">
        <span>📣 ご主人はいま…</span>
        <button id="lonelyBtn" class="mini-btn">🥺 さみしい</button>
      </label>
      <div class="master-now" id="masterNow">まだお知らせはありません</div>
      <div class="master-time" id="masterTime"></div>
    </div>

    <div class="card cheer-card" id="cheerCard">
      <label>💌 ご主人からのメッセージ</label>
      <div class="cheer-now" id="cheerNow">まだメッセージはありません</div>
      <div class="master-time" id="cheerTime"></div>
    </div>

    <div class="card">
      <label>する事🩷</label>
      <div class="care-buttons">
        <button id="lockBtn" class="care-btn">鍵：まだ</button>
        <button id="creamBtn" class="care-btn">クリームを塗る</button>
        <button id="collarBtn" class="care-btn">首輪：まだ</button>
        <button id="lookBtn" class="care-btn">見て欲しい！</button>
      </div>
      <div class="care-state" id="lockStateText"></div>
      <div class="care-state" id="creamStateText"></div>
      <div class="care-state" id="collarStateText"></div>
      <div class="care-state" id="lookStateText"></div>
      <div class="todo-warn" id="todoWarn"></div>
      <div class="stamp-box">
        <div class="stamp-title">今週のごほうびスタンプ <span id="stampCount">0個</span></div>
        <div class="stamp-row" id="stampRow"></div>
        <div class="stamp-bar">
          <div class="stamp-bar-fill" id="stampBarFill"></div>
          <div class="stamp-mark"></div>
        </div>
        <div class="stamp-goal" id="stampGoal"></div>
        <div class="stamp-help">
          <div>・する事をやると スタンプが 1つ もらえるよ</div>
          <div>・<b>7つ</b>あつめると <b>ごほうび🎁</b></div>
          <div>・<b>14こ</b>あつめると <b>もっとごほうび🎁🎁</b></div>
          <div>・スタンプは 毎週月曜日に リセットされるよ</div>
          <div>・ご主人から スタンプを もらえることもあるよ</div>
        </div>
      </div>
    </div>

    <div class="card">
      <label>🐾 いまの状態を選ぶ</label>
      <div class="buttons" id="statusButtons"></div>

      <div class="send-row">
        <input type="text" id="customMsg" placeholder="自由に書く（例：30分で戻る）" />
        <button class="send" id="sendCustom">送信</button>
      </div>
      <div class="notice" id="permNotice"></div>
    </div>

    <div class="card">
      <label>🍚 きょうのごはん予定</label>
      <div class="today-meal" id="todayMeal">
        <div class="today-label" id="todayLabel">今日</div>
        <div class="today-val" id="todayVal">まだ決まっていません</div>
      </div>
      <div id="mealPlan" class="meal-view">
        <div class="meal-row"><span class="meal-label">平日の夜</span><span class="meal-val" id="mvWeekdayDinner">まだ決まっていません</span></div>
        <div class="meal-row"><span class="meal-label">土日の昼</span><span class="meal-val" id="mvWeekendLunch">まだ決まっていません</span></div>
        <div class="meal-row"><span class="meal-label">土日の夜</span><span class="meal-val" id="mvWeekendDinner">まだ決まっていません</span></div>
      </div>
      <div class="send-row">
        <input type="text" id="reqMsg" placeholder="ごはんのリクエスト（例：からあげがいい！）" />
        <button class="send" id="sendReq">🦴 おねがい</button>
      </div>
    </div>

    <div class="card">
      <label>🐾 履歴 <span class="pill" id="connState">接続中…</span></label>
      <div id="board" class="board"><div class="empty">まだ誰も状態を送っていません 🦴</div></div>
    </div>
  </div>

  <!-- 送信したときに出る「わん！」のお知らせ -->
  <div id="toast" class="toast"></div>

  <script src="push.js"></script>
  <script src="app.js"></script>
</body>
</html>
