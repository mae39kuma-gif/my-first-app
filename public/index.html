<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>いまなにしてる？</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --accent: #5b7cfa;
      --text: #2b2f3a;
      --muted: #8a90a2;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-text-size-adjust: 100%;
    }
    .wrap { max-width: 480px; margin: 0 auto; padding: 20px 16px 60px; }
    h1 { font-size: 22px; margin: 8px 0 4px; }
    .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 18px;
      box-shadow: 0 2px 10px rgba(40,50,90,0.06);
    }
    label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 6px; }
    input[type="text"] {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #e2e5ee;
      border-radius: 10px;
      outline: none;
    }
    input[type="text"]:focus { border-color: var(--accent); }
    .buttons { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 4px; }
    button.status {
      padding: 16px 8px;
      font-size: 16px;
      border: none;
      border-radius: 12px;
      background: #eef1fb;
      color: var(--text);
      cursor: pointer;
      transition: transform .05s, background .15s;
    }
    button.status:hover { background: #e2e7fb; }
    button.status:active { transform: scale(0.97); }
    .send-row { display: flex; gap: 8px; margin-top: 12px; }
    .send-row input { flex: 1; }
    button.send {
      padding: 0 18px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      cursor: pointer;
    }
    .feed-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 4px;
      border-bottom: 1px solid #f0f2f7;
    }
    .feed-item:last-child { border-bottom: none; }
    .emoji { font-size: 26px; }
    .feed-name { font-weight: 600; }
    .feed-status { font-size: 14px; }
    .feed-time { color: var(--muted); font-size: 12px; margin-left: auto; white-space: nowrap; }
    .empty { color: var(--muted); font-size: 14px; text-align: center; padding: 16px; }
    .notice { font-size: 12px; color: var(--muted); margin-top: 8px; }
    .pill { display:inline-block; background:#eef1fb; color:var(--accent); border-radius:999px; padding:2px 10px; font-size:12px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>いまなにしてる？</h1>
    <p class="sub">名前を入れてボタンを押すと、相手の画面に通知が飛びます。</p>

    <div class="card">
      <label for="name">あなたの名前</label>
      <input type="text" id="name" placeholder="例：たろう" />
    </div>

    <div class="card">
      <label>いまの状態を選ぶ</label>
      <div class="buttons" id="statusButtons"></div>

      <div class="send-row">
        <input type="text" id="customMsg" placeholder="自由に書く（例：30分で戻る）" />
        <button class="send" id="sendCustom">送信</button>
      </div>
      <div class="notice" id="permNotice"></div>
    </div>

    <div class="card">
      <label>みんなの状況 <span class="pill" id="connState">接続中…</span></label>
      <div id="feed"><div class="empty">まだ通知はありません</div></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
