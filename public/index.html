<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🐶 いまなにしてる？</title>
  <!-- ブラウザのタブに表示される🐶アイコン -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐶</text></svg>" />
  <style>
    :root {
      --bg: #f6ede1;        /* クリーム色（わんこテーマ） */
      --card: #fffaf3;
      --accent: #b5793f;    /* 犬の毛色っぽい茶色 */
      --accent-dark: #8a5a2b;
      --text: #4a3625;
      --muted: #a98e72;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background: var(--bg);
      /* うっすら足あと🐾を背景に散らす */
      background-image: radial-gradient(circle at 10% 20%, rgba(181,121,63,0.05) 0 8px, transparent 9px),
                        radial-gradient(circle at 80% 60%, rgba(181,121,63,0.05) 0 8px, transparent 9px),
                        radial-gradient(circle at 40% 85%, rgba(181,121,63,0.05) 0 8px, transparent 9px);
      color: var(--text);
      -webkit-text-size-adjust: 100%;
    }
    .wrap { max-width: 480px; margin: 0 auto; padding: 20px 16px 60px; }
    h1 { font-size: 22px; margin: 8px 0 4px; }
    .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 18px;
      box-shadow: 0 2px 10px rgba(40,50,90,0.06);
    }
    label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 6px; }
    input[type="text"] {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #e2e5ee;
      border-radius: 10px;
      outline: none;
    }
    input[type="text"]:focus { border-color: var(--accent); }
    .buttons { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 4px; }
    button.status {
      padding: 16px 8px;
      font-size: 16px;
      border: none;
      border-radius: 12px;
      background: #f1e2cf;
      color: var(--text);
      cursor: pointer;
      transition: transform .05s, background .15s;
    }
    button.status:hover { background: #ead2b3; }
    button.status:active { transform: scale(0.97); }
    .send-row { display: flex; gap: 8px; margin-top: 12px; }
    .send-row input { flex: 1; }
    button.send {
      padding: 0 18px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      cursor: pointer;
    }
    .board { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 4px; }
    .person {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      border-radius: 12px;
      background: #f5e9d8;
      border: 1px solid #ecdcc4;
      animation: pop .25s ease;
    }
    .person.me { border-color: var(--accent); background: #f3e0c6; }
    @keyframes pop { from { transform: scale(0.96); opacity: .4; } to { transform: scale(1); opacity: 1; } }
    .emoji { font-size: 28px; }
    .person-name { font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 6px; }
    .you-tag { font-size: 10px; background: var(--accent); color: #fff; border-radius: 999px; padding: 1px 6px; }
    .person-status { font-size: 13px; }
    .person-time { color: var(--muted); font-size: 11px; margin-top: 2px; }
    .empty { color: var(--muted); font-size: 14px; text-align: center; padding: 16px; grid-column: 1 / -1; }
    .notice { font-size: 12px; color: var(--muted); margin-top: 8px; }
    .pill { display:inline-block; background:#f1e2cf; color:var(--accent-dark); border-radius:999px; padding:2px 10px; font-size:12px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>🐶 いまなにしてる？</h1>
    <p class="sub">🐾 名前を入れてボタンを押すと、相手の画面に通知が飛びます。</p>

    <div class="card">
      <label for="name">🐾 あなたの名前</label>
      <input type="text" id="name" placeholder="例：たろう" />
    </div>

    <div class="card">
      <label>🐾 いまの状態を選ぶ</label>
      <div class="buttons" id="statusButtons"></div>

      <div class="send-row">
        <input type="text" id="customMsg" placeholder="自由に書く（例：30分で戻る）" />
        <button class="send" id="sendCustom">送信</button>
      </div>
      <div class="notice" id="permNotice"></div>
    </div>

    <div class="card">
      <label>🐾 全員ダッシュボード <span class="pill" id="connState">接続中…</span></label>
      <div id="board" class="board"><div class="empty">まだ誰も状態を送っていません 🦴</div></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
