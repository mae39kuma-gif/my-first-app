<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>マイダッシュボード</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card2: #273449;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent2: #34d399;
      --danger: #f87171;
      --radius: 18px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: env(safe-area-inset-top) 14px calc(env(safe-area-inset-bottom) + 24px) 14px;
      max-width: 640px;
      margin: 0 auto;
      min-height: 100vh;
    }
    h1, h2, h3 { margin: 0; font-weight: 700; }
    .muted { color: var(--muted); }

    /* --- 時計 --- */
    .greeting { font-size: 15px; color: var(--muted); }
    .clock { font-size: 54px; font-weight: 800; letter-spacing: 1px; line-height: 1.1; font-variant-numeric: tabular-nums; }
    .clock .sec { font-size: 22px; color: var(--accent); vertical-align: 5px; }
    .date { font-size: 15px; color: var(--muted); margin-top: 2px; }
    .widget.span1 .clock { font-size: 40px; }
    .widget.span1 .clock .sec { font-size: 16px; }

    /* --- ツールバー --- */
    .toolbar { display: flex; justify-content: flex-end; align-items: center; gap: 14px; margin-top: 10px; min-height: 36px; }
    /* ＋ボタンは無色で背景に同化 */
    .add-btn {
      background: transparent; color: var(--muted); border: none;
      font-size: 30px; font-weight: 300; line-height: 1; cursor: pointer;
      padding: 0 4px; display: grid; place-items: center;
    }
    .add-btn:active { opacity: .5; }
    .done-btn {
      background: transparent; border: none; color: var(--accent);
      font-size: 16px; font-weight: 700; cursor: pointer; padding: 4px 6px;
    }
    .hidden { display: none !important; }

    /* --- ウィジェットのグリッド --- */
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 12px; }
    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,.25);
      min-width: 0;
    }
    .widget { position: relative; }
    .widget.span1 { grid-column: span 1; }
    .widget.span2 { grid-column: 1 / -1; }
    /* 編集モード用：カードの誤選択を防ぐ（入力欄では選択を許可） */
    .widget { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
    .widget input, .widget textarea { -webkit-user-select: text; user-select: text; }
    .widget.pressing { transform: scale(.97); transition: transform .12s; }

    /* --- iPhone風 編集モード（ぷるぷる） --- */
    @keyframes jiggle {
      0% { transform: rotate(-0.8deg); }
      50% { transform: rotate(0.8deg); }
      100% { transform: rotate(-0.8deg); }
    }
    .grid.editing .widget { animation: jiggle .26s infinite ease-in-out; }
    .grid.editing .widget:nth-child(2n) { animation-delay: -.13s; animation-duration: .3s; }
    .grid.editing .widget:nth-child(3n) { animation-delay: -.07s; animation-duration: .24s; }
    .grid.editing .widget.dragging { animation: none; }
    /* 編集中の操作バッジ（−削除 / ⤢大きさ） */
    .edit-badge {
      position: absolute; width: 26px; height: 26px; border-radius: 50%;
      border: none; display: none; place-items: center; cursor: pointer;
      font-size: 18px; font-weight: 800; z-index: 6; line-height: 1;
      box-shadow: 0 2px 6px rgba(0,0,0,.4);
    }
    .grid.editing .edit-badge { display: grid; }
    .del-badge { top: -8px; left: -8px; background: #ef4444; color: #fff; }
    .size-badge { top: -8px; right: -8px; background: #334155; color: #e2e8f0; font-size: 14px; }
    /* ドラッグ中に浮くカード */
    .widget.dragging { opacity: .96; box-shadow: 0 12px 30px rgba(0,0,0,.5); transform: scale(1.04); }
    /* 並べ替え時の受け皿 */
    .widget.placeholder { background: transparent; outline: 2px dashed #3b4d6b; outline-offset: -2px; box-shadow: none; pointer-events: none; }

    /* --- 時計ウィジェット --- */
    .clock-widget { text-align: center; padding: 4px 0; }
    .card-title {
      display: flex; align-items: center; gap: 8px;
      font-size: 15px; color: var(--muted);
      margin-bottom: 12px; font-weight: 600;
    }

    /* --- 長押しメニューの削除ボタン --- */
    .danger-btn { color: var(--danger) !important; }

    /* --- 天気 --- */
    .weather-main { display: flex; align-items: center; gap: 14px; }
    .weather-icon { font-size: 44px; line-height: 1; }
    .weather-temp { font-size: 38px; font-weight: 800; }
    .weather-desc { color: var(--muted); font-size: 14px; }
    .weather-range { display: flex; gap: 12px; margin-top: 10px; font-size: 13px; flex-wrap: wrap; }
    .weather-range b { color: var(--text); }

    /* --- 市場指標 --- */
    .market-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .m-item { background: var(--card2); border-radius: 12px; padding: 10px 12px; }
    .m-label { font-size: 12px; color: var(--muted); }
    .m-value { font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .m-change { font-size: 12px; font-variant-numeric: tabular-nums; }
    .up { color: #4ade80; }
    .down { color: #f87171; }

    /* --- ToDo --- */
    .row { display: flex; gap: 8px; }
    input[type="text"] {
      flex: 1; min-width: 0;
      background: var(--card2); border: 1px solid #334155; color: var(--text);
      border-radius: 12px; padding: 12px 14px; font-size: 16px;
    }
    input[type="text"]:focus { outline: none; border-color: var(--accent); }
    button.primary {
      border: none; border-radius: 12px; padding: 12px 16px;
      font-size: 16px; font-weight: 700; cursor: pointer;
      background: var(--accent); color: #06283d;
    }
    button:active { transform: scale(.97); }
    .todo-list { list-style: none; margin: 12px 0 0; padding: 0; }
    .todo-item {
      display: flex; align-items: center; gap: 10px;
      padding: 11px 4px; border-bottom: 1px solid #2b3a52;
    }
    .todo-item:last-child { border-bottom: none; }
    .todo-check {
      width: 24px; height: 24px; flex: none; border-radius: 7px;
      border: 2px solid #475569; display: grid; place-items: center;
      cursor: pointer; font-size: 15px; color: #06283d;
    }
    .todo-item.done .todo-check { background: var(--accent2); border-color: var(--accent2); }
    .todo-text { flex: 1; font-size: 16px; word-break: break-word; }
    .todo-item.done .todo-text { text-decoration: line-through; color: var(--muted); }
    .todo-del { background: none; border: none; color: var(--muted); padding: 6px; font-size: 18px; cursor: pointer; }
    .empty { color: var(--muted); font-size: 14px; padding: 8px 4px; }

    /* --- メモ --- */
    textarea {
      width: 100%; min-height: 110px; resize: vertical;
      background: var(--card2); border: 1px solid #334155; color: var(--text);
      border-radius: 12px; padding: 12px 14px; font-size: 16px; line-height: 1.6;
      font-family: inherit;
    }
    textarea:focus { outline: none; border-color: var(--accent); }
    .saved-hint { font-size: 12px; color: var(--accent2); height: 16px; margin-top: 4px; }

    /* --- リンク集 --- */
    .links-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 10px; }
    .link-tile {
      background: var(--card2); border-radius: 14px; padding: 14px 6px;
      text-align: center; text-decoration: none; color: var(--text);
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      position: relative; overflow: hidden;
    }
    .link-emoji { font-size: 26px; line-height: 1; }
    .link-name { font-size: 12px; color: var(--muted); width: 100%;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .link-del {
      position: absolute; top: 2px; right: 4px; background: none; border: none; color: var(--muted);
      padding: 2px 6px; font-size: 14px; border-radius: 8px; cursor: pointer;
    }
    .link-add { border: 2px dashed #3b4d6b; background: transparent; cursor: pointer; }
    .link-add .link-emoji { color: var(--muted); }

    .accent { color: var(--accent); }
    input[type="date"] {
      background: var(--card2); border: 1px solid #334155; color: var(--text);
      border-radius: 12px; padding: 11px 12px; font-size: 15px; font-family: inherit;
    }
    input[type="date"]:focus { outline: none; border-color: var(--accent); }

    /* --- 週間天気 --- */
    .wk-row { display: flex; align-items: center; gap: 8px; padding: 8px 2px; border-bottom: 1px solid #2b3a52; font-size: 14px; }
    .wk-row:last-child { border-bottom: none; }
    .wk-day { width: 64px; color: var(--muted); }
    .wk-ico { font-size: 20px; width: 28px; text-align: center; }
    .wk-pop { width: 46px; color: var(--accent); font-size: 13px; }
    .wk-temp { flex: 1; text-align: right; font-variant-numeric: tabular-nums; }
    .wk-temp b { color: var(--text); }

    /* --- 日の出・日の入り --- */
    .sun-main { display: flex; gap: 12px; }
    .sun-item { flex: 1; display: flex; align-items: center; gap: 12px; background: var(--card2); border-radius: 12px; padding: 12px 14px; }
    .sun-ico { font-size: 30px; }
    .sun-time { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }

    /* --- ニュース --- */
    .news-item { display: flex; gap: 8px; align-items: flex-start; padding: 10px 2px; border-bottom: 1px solid #2b3a52; text-decoration: none; color: var(--text); }
    .news-item:last-child { border-bottom: none; }
    .news-dot { color: var(--accent); }
    .news-title { font-size: 14px; line-height: 1.45; }

    /* --- カウントダウン --- */
    .cd-form { flex-wrap: wrap; }
    .cd-list { list-style: none; margin: 12px 0 0; padding: 0; }
    .cd-row { display: flex; align-items: center; gap: 10px; padding: 10px 2px; border-bottom: 1px solid #2b3a52; }
    .cd-row:last-child { border-bottom: none; }
    .cd-name { flex: 1; font-size: 15px; word-break: break-word; }
    .cd-badge { font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .cd-del, .habit-del { background: none; border: none; color: var(--muted); padding: 4px 6px; font-size: 18px; cursor: pointer; }

    /* --- 習慣トラッカー --- */
    .habit-list { list-style: none; margin: 12px 0 0; padding: 0; }
    .habit-row { display: flex; align-items: center; gap: 10px; padding: 9px 2px; border-bottom: 1px solid #2b3a52; }
    .habit-row:last-child { border-bottom: none; }
    .habit-toggle {
      width: 30px; height: 30px; flex: none; border-radius: 9px;
      border: 2px solid #475569; background: transparent; color: #06283d;
      display: grid; place-items: center; cursor: pointer; font-size: 16px; font-weight: 800;
    }
    .habit-toggle.done { background: var(--accent2); border-color: var(--accent2); }
    .habit-name { flex: 1; font-size: 15px; word-break: break-word; }
    .habit-streak { font-size: 14px; color: #fb923c; font-weight: 700; }

    .small-btn { background: var(--card2); color: var(--muted); border: none; border-radius: 10px; font-size: 13px; padding: 8px 12px; cursor: pointer; }

    dialog {
      background: var(--card); color: var(--text); border: none; border-radius: 16px;
      padding: 18px; width: min(90vw, 360px);
    }
    dialog::backdrop { background: rgba(0,0,0,.6); }
    dialog input { margin-top: 10px; width: 100%; }
    .dialog-actions { display: flex; gap: 8px; margin-top: 14px; }
    .dialog-actions button { flex: 1; }
    .add-list { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
    .add-list button {
      text-align: left; background: var(--card2); color: var(--text); border: none;
      border-radius: 12px; padding: 13px 14px; font-size: 15px; cursor: pointer;
    }

    footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 22px; }
    footer a { color: var(--accent); }
  </style>
</head>
<body>
  <!-- ツールバー（右上）：通常は無色の＋、編集中は「完了」 -->
  <div class="toolbar">
    <button class="done-btn hidden" id="done-btn">完了</button>
    <button class="add-btn" id="add-btn" aria-label="ウィジェットを追加">＋</button>
  </div>

  <!-- ウィジェット置き場（中身はJSで作ります） -->
  <div class="grid" id="grid"></div>

  <footer>
    マイダッシュボード · データはこの端末に保存されます<br />
    <a href="/">いまなにしてる？へ →</a>
  </footer>

  <!-- リンク追加ダイアログ -->
  <dialog id="link-dialog">
    <h3>ショートカットを追加</h3>
    <input type="text" id="link-name" placeholder="名前（例：YouTube）" maxlength="20" />
    <input type="text" id="link-url" placeholder="URL（例：https://youtube.com）" />
    <input type="text" id="link-emoji" placeholder="絵文字（例：📺 ／ 空欄でも可）" maxlength="4" />
    <div class="dialog-actions">
      <button class="small-btn" id="link-cancel">キャンセル</button>
      <button class="primary" id="link-save">追加</button>
    </div>
  </dialog>

  <!-- ウィジェット追加ダイアログ -->
  <dialog id="add-widget-dialog">
    <h3>ウィジェットを追加</h3>
    <div class="add-list" id="add-widget-list"></div>
    <div class="dialog-actions">
      <button class="small-btn" id="add-widget-cancel">閉じる</button>
    </div>
  </dialog>

  <script src="dashboard.js"></script>
</body>
</html>
